version: '3.8'

services:
  app:
    build: .
    user: "nodejs:nodejs"
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DIALECT=${DB_DIALECT}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - PORT=${PORT}
      - OCPI_VERSION=${OCPI_VERSION}
      - OCPI_BASE_URL=${OCPI_BASE_URL}
      - OCPI_PARTY_ID=${OCPI_PARTY_ID}
      - OCPI_COUNTRY_CODE=${OCPI_COUNTRY_CODE}
      - OCPI_TOKEN=${OCPI_TOKEN}
      - EVSE_NOTIFICATION_INTERVAL_MS=${EVSE_NOTIFICATION_INTERVAL_MS}
      - EMSP_LOCATIONS_SYNC_INTERVAL_MS=${EMSP_LOCATIONS_SYNC_INTERVAL_MS}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS}
      - DISABLE_RATE_LIMIT=${DISABLE_RATE_LIMIT}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
    networks:
      - cpo-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cpo-network

  redis:
    image: redis:7-alpine
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - cpo-network

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@cpo.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - cpo-network

volumes:
  postgres_data:
  redis_data:
  logs_data:

networks:
  cpo-network:
    driver: bridge




